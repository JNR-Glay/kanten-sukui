<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>寒天すくい</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#f4eee4;color:#332b25;display:flex;justify-content:center;align-items:center}#game{width:min(96vw,900px);text-align:center}h1{margin:8px 0 4px;font-size:28px}#info{display:flex;justify-content:space-between;max-width:760px;margin:0 auto 8px;font-weight:800;font-size:18px}
#table{position:relative;width:min(90vw,760px);aspect-ratio:1.55;margin:auto;background:#d8c19e;border:12px solid #8c6542;border-radius:28px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 3px #b68e62,0 8px 20px #0002}
#plate{position:absolute;left:5%;top:7%;width:90%;height:86%;border-radius:50%;overflow:hidden;border:7px solid #ddd1c0;background:radial-gradient(circle at 25% 20%,#6e4328aa 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#2f170d66 0 2px,transparent 3px),linear-gradient(145deg,#5b321e,#3c1f12 55%,#2b150c);box-shadow:inset 0 8px 18px #0008,inset 0 -4px 8px #fff2}
#plate:after{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid #9b6846aa;pointer-events:none}.item{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}.agar{width:28px;height:24px;border-radius:7px;background:linear-gradient(135deg,#ffffffdd,#d8f4efaa);border:2px solid #c7e7e0cc;box-shadow:inset 3px 3px 5px #fff9,1px 2px 3px #0006}.bean{width:25px;height:21px;border-radius:50%;background:linear-gradient(135deg,#4a352a,#160d09);border:2px solid #100906;box-shadow:inset 4px 2px 4px #856b5b88,1px 2px 3px #0008}
.mochi{width:27px;height:20px;border-radius:4px;border:2px solid #ffffff99;box-shadow:inset 3px 3px 5px #fff8,1px 2px 4px #0007}.mochi.red{background:linear-gradient(135deg,#ffaaa2,#e44b48 65%,#a51f28)}.mochi.green{background:linear-gradient(135deg,#c8f3b0,#65b95c 65%,#28733a)}
#spoon{position:absolute;width:128px;height:48px;transform:translate(-50%,-50%);pointer-events:none;z-index:20;transition:left .04s linear,top .04s linear}#spoonHead{position:absolute;left:0;top:50%;transform:translateY(-50%);width:48px;height:38px;border-radius:52% 48% 48% 52%;background:linear-gradient(135deg,#f5f5f5,#aaa);border:2px solid #777;box-shadow:inset 5px 4px 8px #fff9,2px 3px 4px #0005}#spoonHandle{position:absolute;left:39px;top:50%;transform:translateY(-50%);width:89px;height:12px;border-radius:8px;background:linear-gradient(90deg,#888,#eee 45%,#999);border:1px solid #777;box-shadow:1px 2px 3px #0004}#spoon.scooping{animation:scoop .34s ease-in-out}@keyframes scoop{0%{transform:translate(-50%,-50%) rotate(0)}30%{transform:translate(-50%,-43%) rotate(-9deg)}55%{transform:translate(-50%,-57%) rotate(7deg)}100%{transform:translate(-50%,-50%) rotate(0)}}
#table.stirring #plate{animation:stir .45s ease-in-out 2}@keyframes stir{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg) scale(1.01)}75%{transform:rotate(1deg) scale(1.01)}}
#pourBag{position:absolute;right:4%;top:2%;width:105px;height:88px;z-index:30;opacity:0;pointer-events:none;transform:rotate(-18deg) translateY(-15px);transform-origin:80% 80%}#pourBag .bag{width:72px;height:58px;margin:auto;background:linear-gradient(135deg,#fff2c9,#d9b36a);border:3px solid #8f6833;border-radius:7px 7px 12px 12px;box-shadow:2px 3px 5px #0004;position:relative}#pourBag .bag:before{content:"あんみつ";position:absolute;left:8px;top:17px;font-weight:900;font-size:14px;color:#704321}#pourBag .drop{position:absolute;width:8px;height:12px;border-radius:50%;background:#5a301c;left:46px;top:61px;opacity:0}#pourBag.pouring{animation:bag .8s ease-out}#pourBag.pouring .drop{animation:drop .55s .12s ease-in infinite}@keyframes bag{0%{opacity:0;transform:rotate(-18deg) translateY(-15px)}20%{opacity:1}55%{opacity:1;transform:rotate(-32deg) translateY(2px)}100%{opacity:0;transform:rotate(-18deg) translateY(-15px)}}@keyframes drop{0%{opacity:0}25%{opacity:1}100%{opacity:0;transform:translate(-12px,65px)}}
#controls{margin-top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:14px 24px;font-size:18px;font-weight:800;cursor:pointer;background:#5b4030;color:white;box-shadow:0 4px 0 #38271e;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #38271e}#scoopBtn{background:#47735b}#stirBtn{background:#9b633c}#message{min-height:28px;margin-top:9px;font-weight:700}
#startOverlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:100}.panel{background:#fffaf2;border-radius:22px;padding:24px;width:min(90vw,430px);box-shadow:0 12px 35px #0005}.panel p{line-height:1.7}.scoreBox{display:flex;justify-content:center;gap:28px;margin:12px 0 18px;padding:12px;border-radius:15px;background:#efe2ce;font-size:18px;font-weight:900}.scoreBox strong{font-size:26px}.hint{font-size:13px;color:#6c5c4f;margin-top:12px}
</style>
</head>
<body>
<div id="game"><h1>🥄 寒天すくい</h1><div id="info"><span>得点：<b id="score">0</b></span><span>自己ベスト：<b id="best">0</b></span><span>残り：<b id="time">60.0</b>秒</span></div><div id="table"><div id="plate"></div><div id="pourBag"><div class="bag"></div><div class="drop"></div></div><div id="spoon"><div id="spoonHandle"></div><div id="spoonHead"></div></div></div><div id="controls"><button id="scoopBtn">🥄 すくう！</button><button id="stirBtn">🌀 かき混ぜる</button></div><div id="message">皿の中をドラッグしてスプーンを移動</div></div>
<div id="startOverlay"><div class="panel"><h2 id="overlayTitle">寒天すくい</h2><div class="scoreBox"><span>得点<br><strong id="overlayScore">0</strong></span><span>自己ベスト<br><strong id="overlayBest">0</strong></span></div><p>スプーンの<b>すくう部分</b>で寒天を狙おう。<br>寒天 +1点、黒豆 -1点、求肥 +2点。<br>残り30秒を切ると赤・緑の求肥が追加されます。</p><button id="startBtn">スタート！</button><div class="hint">かき混ぜると具材がランダムに散らばります。</div></div></div>
<script>
const plate=document.getElementById('plate'),table=document.getElementById('table'),spoon=document.getElementById('spoon'),scoopBtn=document.getElementById('scoopBtn'),stirBtn=document.getElementById('stirBtn'),overlay=document.getElementById('startOverlay'),startBtn=document.getElementById('startBtn'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),timeEl=document.getElementById('time'),msg=document.getElementById('message'),oScore=document.getElementById('overlayScore'),oBest=document.getElementById('overlayBest'),oTitle=document.getElementById('overlayTitle'),bag=document.getElementById('pourBag');
let items=[],score=0,best=Number(localStorage.getItem('kantenBest')||0),running=false,endTime=0,raf=0,drag=false,spoonX=50,spoonY=50,round=0;bestEl.textContent=best;oBest.textContent=best;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function pos(it){let x,y;do{x=8+Math.random()*84;y=8+Math.random()*84}while(((x-50)/46)**2+((y-50)/43)**2>.88);it.x=x;it.y=y;it.el.style.left=x+'%';it.el.style.top=y+'%'}
function add(type,variant=''){let el=document.createElement('div');el.className=`item ${type} ${variant}`;plate.appendChild(el);let it={type,el};pos(it);items.push(it)}
function roundAdd(){for(let i=0;i<rand(10,15);i++)add('agar');for(let i=0;i<rand(5,8);i++)add('bean');let elapsed=60-Math.max(0,(endTime-performance.now())/1000);if(elapsed>=30){for(let i=0;i<rand(2,4);i++)add('mochi',i%2?'green':'red');msg.textContent=`第${round+1}回投入！ 赤・緑の求肥も追加！`}else msg.textContent=`第${round+1}回投入！`;round++;bag.classList.remove('pouring');void bag.offsetWidth;bag.classList.add('pouring')}
function move(x,y){let r=table.getBoundingClientRect(),fx=Math.max(5,Math.min(95,(x-r.left)/r.width*100)),fy=Math.max(5,Math.min(95,(y-r.top)/r.height*100));let ox=(128-39)/r.width*100;spoonX=Math.max(5,Math.min(95,fx-ox));spoonY=fy;spoon.style.left=spoonX+'%';spoon.style.top=spoonY+'%'}
function scoop(){if(!running)return;spoon.classList.remove('scooping');void spoon.offsetWidth;spoon.classList.add('scooping');let r=table.getBoundingClientRect(),sx=r.left+r.width*(spoonX/100)+(24/128)*r.width,sy=r.top+r.height*(spoonY/100),got=[],a=0,b=0,m=0;for(let it of items){let q=it.el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;if(Math.hypot(x-sx,y-sy)<29){got.push(it);if(it.type==='agar')a++;else if(it.type==='bean')b++;else m++}}if(!got.length){msg.textContent='……何もすくえなかった！';return}for(let it of got){it.el.remove();items.splice(items.indexOf(it),1)}score+=a-b+m*2;scoreEl.textContent=score;oScore.textContent=score;let p=[];if(a)p.push(`寒天 +${a}`);if(b)p.push(`黒豆 -${b}`);if(m)p.push(`求肥 +${m*2}`);msg.textContent=p.join(' / ');if(!items.some(x=>x.type==='agar'))roundAdd()}
function stir(){if(!running)return;table.classList.remove('stirring');void table.offsetWidth;table.classList.add('stirring');setTimeout(()=>items.forEach(pos),260);msg.textContent='ぐるぐる……具材が散らばった！'}
function tick(){if(!running)return;let t=Math.max(0,(endTime-performance.now())/1000);timeEl.textContent=t.toFixed(1);if(t<=0)finish();else raf=requestAnimationFrame(tick)}
function start(){items.forEach(x=>x.el.remove());items=[];score=0;round=0;scoreEl.textContent=0;oScore.textContent=0;timeEl.textContent='60.0';spoonX=50;spoonY=50;spoon.style.left='50%';spoon.style.top='50%';running=true;overlay.style.display='none';endTime=performance.now()+60000;roundAdd();raf=requestAnimationFrame(tick)}
function finish(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;localStorage.setItem('kantenBest',best)}bestEl.textContent=best;oScore.textContent=score;oBest.textContent=best;oTitle.textContent='結果発表！';msg.textContent=`終了！ 最終得点：${score}点`;timeEl.textContent='0.0';overlay.style.display='flex';startBtn.textContent='もう一回！'}
table.addEventListener('pointerdown',e=>{if(!running)return;drag=true;table.setPointerCapture(e.pointerId);move(e.clientX,e.clientY)});table.addEventListener('pointermove',e=>{if(drag)move(e.clientX,e.clientY)});table.addEventListener('pointerup',()=>drag=false);table.addEventListener('pointercancel',()=>drag=false);scoopBtn.onclick=scoop;stirBtn.onclick=stir;startBtn.onclick=start;
</script>
</body>
</html>
