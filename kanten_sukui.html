<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>寒天すくい</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4eee4;
    color: #332b25;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game {
    width: min(96vw, 900px);
    text-align: center;
  }
  h1 { margin: 8px 0 4px; font-size: 28px; }
  #info {
    display: flex;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto 8px;
    font-weight: 700;
    font-size: 18px;
  }
  #table {
    position: relative;
    width: min(90vw, 760px);
    aspect-ratio: 1.55;
    margin: auto;
    background: #d8c19e;
    border: 12px solid #8c6542;
    border-radius: 28px;
    overflow: hidden;
    touch-action: none;
    box-shadow: inset 0 0 0 3px #b68e62, 0 8px 20px #0002;
  }
  #plate {
    position: absolute;
    left: 5%;
    top: 7%;
    width: 90%;
    height: 86%;
    border-radius: 50%;
    background: #fffaf2;
    border: 7px solid #ddd1c0;
    box-shadow: inset 0 5px 12px #0001;
    overflow: hidden;
  }
  .item {
    position: absolute;
    transform: translate(-50%, -50%);
    user-select: none;
    pointer-events: none;
  }
  .agar {
    width: 27px;
    height: 23px;
    border-radius: 7px;
    background: rgba(245, 250, 248, .88);
    border: 2px solid rgba(185, 205, 198, .9);
    box-shadow: inset 2px 2px 5px #fff, 1px 2px 3px #0002;
  }
  .bean {
    width: 25px;
    height: 21px;
    border-radius: 50%;
    background: #28211d;
    border: 2px solid #120f0d;
    box-shadow: inset 3px 2px 4px #5b4940, 1px 2px 3px #0003;
  }
  #spoon {
    position: absolute;
    width: 58px;
    height: 90px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
    transition: left .04s linear, top .04s linear;
  }
  #spoonHead {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 46px;
    height: 57px;
    border-radius: 50% 50% 46% 46%;
    background: linear-gradient(135deg, #eee, #aaa);
    border: 2px solid #777;
    box-shadow: inset 4px 4px 7px #fff8, 2px 3px 4px #0004;
  }
  #spoonHandle {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%) rotate(2deg);
    transform-origin: bottom;
    width: 13px;
    height: 48px;
    border-radius: 8px;
    background: linear-gradient(90deg, #999, #eee, #999);
    border: 1px solid #777;
  }
  #controls {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    background: #5b4030;
    color: white;
    box-shadow: 0 4px 0 #38271e;
    touch-action: manipulation;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #38271e; }
  #scoopBtn { background: #47735b; }
  #message {
    min-height: 28px;
    margin-top: 9px;
    font-weight: 700;
  }
  #startOverlay {
    position: fixed;
    inset: 0;
    background: #0008;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .panel {
    background: #fffaf2;
    border-radius: 22px;
    padding: 28px;
    width: min(90vw, 420px);
    box-shadow: 0 12px 35px #0005;
  }
  .panel p { line-height: 1.7; }
  #result { display: none; }
</style>
</head>
<body>
<div id="game">
  <h1>🥄 寒天すくい</h1>
  <div id="info">
    <span>得点：<b id="score">0</b></span>
    <span>残り：<b id="time">60.0</b>秒</span>
  </div>

  <div id="table">
    <div id="plate"></div>
    <div id="spoon">
      <div id="spoonHandle"></div>
      <div id="spoonHead"></div>
    </div>
  </div>

  <div id="controls">
    <button id="scoopBtn">🥄 すくう！</button>
    <button id="resetBtn">リセット</button>
  </div>
  <div id="message">皿の中をクリック・ドラッグしてスプーンを移動</div>
</div>

<div id="startOverlay">
  <div class="panel">
    <h2>寒天すくい</h2>
    <p>
      スプーンを移動して、寒天だけを狙おう。<br>
      「すくう！」でスプーンの範囲内にある具材を回収します。<br>
      寒天 <b>+1点</b>、黒豆 <b>-1点</b>。
    </p>
    <button id="startBtn">スタート！</button>
  </div>
</div>

<script>
const plate = document.getElementById("plate");
const table = document.getElementById("table");
const spoon = document.getElementById("spoon");
const scoopBtn = document.getElementById("scoopBtn");
const resetBtn = document.getElementById("resetBtn");
const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const message = document.getElementById("message");

let items = [];
let score = 0;
let running = false;
let endTime = 0;
let timerId = null;
let spoonX = 50, spoonY = 50;
let dragging = false;
let round = 0;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createRound() {
  // 皿の中に追加投入。黒豆は残ったままなので累積する。
  const agarCount = rand(10, 15);
  const beanCount = rand(5, 8);

  for (let i = 0; i < agarCount; i++) addItem("agar");
  for (let i = 0; i < beanCount; i++) addItem("bean");

  round++;
  message.textContent = `第${round}回投入！ 寒天だけを狙え！`;
}

function addItem(type) {
  const el = document.createElement("div");
  el.className = `item ${type}`;
  plate.appendChild(el);

  // 楕円形の皿から少し内側にランダム配置
  let x, y;
  do {
    x = 8 + Math.random() * 84;
    y = 8 + Math.random() * 84;
  } while (((x - 50) / 46) ** 2 + ((y - 50) / 43) ** 2 > 0.88);

  el.style.left = x + "%";
  el.style.top = y + "%";

  items.push({ type, el, x, y });
}

function setSpoon(clientX, clientY) {
  const r = table.getBoundingClientRect();
  spoonX = Math.max(5, Math.min(95, ((clientX - r.left) / r.width) * 100));
  spoonY = Math.max(5, Math.min(95, ((clientY - r.top) / r.height) * 100));
  spoon.style.left = spoonX + "%";
  spoon.style.top = spoonY + "%";
}

function scoop() {
  if (!running) return;

  const pr = plate.getBoundingClientRect();
  const sx = pr.left + pr.width * (spoonX / 100);
  const sy = pr.top + pr.height * (spoonY / 100);

  // スプーンのすくえる範囲
  const radius = 31;
  let collected = [];
  let gained = 0;
  let beans = 0;

  for (const item of items) {
    const ir = item.el.getBoundingClientRect();
    const ix = ir.left + ir.width / 2;
    const iy = ir.top + ir.height / 2;
    const d = Math.hypot(ix - sx, iy - sy);

    if (d < radius) {
      collected.push(item);
      if (item.type === "agar") {
        gained++;
      } else {
        beans++;
      }
    }
  }

  if (collected.length === 0) {
    message.textContent = "……何もすくえなかった！";
    return;
  }

  for (const item of collected) {
    item.el.remove();
    items.splice(items.indexOf(item), 1);
  }

  score += gained - beans;
  scoreEl.textContent = score;

  if (gained && beans) {
    message.textContent = `寒天 +${gained} / 黒豆 -${beans}`;
  } else if (gained) {
    message.textContent = `寒天 ${gained}個ゲット！`;
  } else {
    message.textContent = `黒豆 ${beans}個…… -${beans}点`;
  }

  // 寒天が0個になったら追加投入。
  if (!items.some(item => item.type === "agar")) {
    createRound();
  }
}

function updateTime() {
  if (!running) return;
  const remaining = Math.max(0, (endTime - performance.now()) / 1000);
  timeEl.textContent = remaining.toFixed(1);

  if (remaining <= 0) {
    finish();
  } else {
    timerId = requestAnimationFrame(updateTime);
  }
}

function startGame() {
  clearItems();
  score = 0;
  round = 0;
  scoreEl.textContent = "0";
  timeEl.textContent = "60.0";
  spoonX = 50;
  spoonY = 50;
  spoon.style.left = "50%";
  spoon.style.top = "50%";
  running = true;
  startOverlay.style.display = "none";
  createRound();
  endTime = performance.now() + 60000;
  timerId = requestAnimationFrame(updateTime);
}

function finish() {
  running = false;
  cancelAnimationFrame(timerId);
  timeEl.textContent = "0.0";
  message.textContent = `終了！ 最終得点：${score}点`;
  startOverlay.style.display = "flex";
  startBtn.textContent = "もう一回！";
}

function clearItems() {
  for (const item of items) item.el.remove();
  items = [];
}

table.addEventListener("pointerdown", e => {
  if (!running) return;
  dragging = true;
  table.setPointerCapture(e.pointerId);
  setSpoon(e.clientX, e.clientY);
});
table.addEventListener("pointermove", e => {
  if (!running || !dragging) return;
  setSpoon(e.clientX, e.clientY);
});
table.addEventListener("pointerup", () => dragging = false);
table.addEventListener("pointercancel", () => dragging = false);

scoopBtn.addEventListener("click", scoop);
startBtn.addEventListener("click", startGame);
resetBtn.addEventListener("click", () => {
  running = false;
  cancelAnimationFrame(timerId);
  clearItems();
  score = 0;
  round = 0;
  scoreEl.textContent = "0";
  timeEl.textContent = "60.0";
  message.textContent = "スタートを押してください";
  startOverlay.style.display = "flex";
  startBtn.textContent = "スタート！";
});
</script>
</body>
</html>
